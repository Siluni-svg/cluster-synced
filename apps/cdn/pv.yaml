apiVersion: v1
kind: PersistentVolume
metadata:
  name: images-pv
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  claimRef:
    namespace: images
    name: images
  nfs:
    server: 192.168.0.17
    path: /volume1/archipelago
