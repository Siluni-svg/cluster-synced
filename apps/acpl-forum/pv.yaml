apiVersion: v1
kind: PersistentVolume

metadata:
  name: acpl-forum-images-pv

spec:
  capacity:
    storage: 1Ti

  accessModes:
    - ReadWriteMany

  persistentVolumeReclaimPolicy: Retain

  storageClassName: ""

  claimRef:
    namespace: acpl-forum
    name: images

  nfs:
    server: 192.168.0.17
    path: /volume1/archipelago