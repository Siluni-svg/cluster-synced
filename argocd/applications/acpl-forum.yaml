apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acpl-forum
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Siluni-svg/cluster-synced.git
    targetRevision: main
    path: apps/acpl-forum

  destination:
    server: https://kubernetes.default.svc
    namespace: acpl-forum

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
